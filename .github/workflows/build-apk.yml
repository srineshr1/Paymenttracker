name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so `git describe` / tags resolve for app version.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @paymenttracker/shared

      - name: Sync app version from git tag
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            export SPENTD_VERSION="${GITHUB_REF_NAME#v}"
          fi
          node apps/mobile/scripts/sync-version.mjs
          VER="$(node -e "console.log(require('./apps/mobile/package.json').version)")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "SPENTD_VERSION=$VER" >> "$GITHUB_ENV"
          echo "App version → $VER"

      - name: Prebuild Android project
        working-directory: apps/mobile
        env:
          SPENTD_VERSION: ${{ env.SPENTD_VERSION }}
        run: |
          if [ ! -f .env ]; then
            echo "EXPO_PUBLIC_API_URL=https://api.example.com" > .env
          fi
          npx expo prebuild --platform android --non-interactive

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPENTD_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::SPENTD_UPLOAD_KEYSTORE_BASE64 secret missing — release will be debug-signed (Play Protect may block install)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/spentd-upload.keystore
          ls -lh apps/mobile/android/spentd-upload.keystore

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          SPENTD_UPLOAD_STORE_PASSWORD: ${{ secrets.SPENTD_UPLOAD_STORE_PASSWORD }}
          SPENTD_UPLOAD_KEY_ALIAS: ${{ secrets.SPENTD_UPLOAD_KEY_ALIAS }}
          SPENTD_UPLOAD_KEY_PASSWORD: ${{ secrets.SPENTD_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f spentd-upload.keystore ]; then
            export SPENTD_UPLOAD_STORE_FILE="$(pwd)/spentd-upload.keystore"
            echo "Using release keystore at $SPENTD_UPLOAD_STORE_FILE"
          else
            echo "No release keystore present — Gradle will fall back to debug signing"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        id: apk
        run: |
          mkdir -p /tmp/release
          SRC=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "APK not found"
            find apps/mobile/android/app/build/outputs -type f
            exit 1
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NAME="spentd-${GITHUB_REF_NAME}.apk"
          else
            NAME="spentd-build-${{ github.run_number }}.apk"
          fi
          cp "$SRC" "/tmp/release/$NAME"
          ls -lh "/tmp/release/$NAME"
          echo "path=/tmp/release/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spentd-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Build release notes
        id: notes
        run: |
          NOTES="/tmp/spentd-release-notes.md"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$NOTES"
          else
            {
              echo "## Spentd APK build #${{ github.run_number }}"
              echo ""
              echo "Manual workflow build (not a version tag)."
              echo ""
              echo "### Recent commits"
              echo ""
              git log -15 --pretty=format:'- %s (%h)' --no-merges
              echo ""
            } > "$NOTES"
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "----- release notes -----"
          cat "$NOTES"

      - name: Publish GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Spentd ${{ github.ref_name }}"
          files: ${{ steps.apk.outputs.path }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          # Allow re-running the workflow on the same tag to refresh APK + notes.
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Spentd APK #${{ github.run_number }}"
          files: ${{ steps.apk.outputs.path }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
